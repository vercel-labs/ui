name: Nightly

on:
  schedule:
    # Monday to Saturday at 03:00 UTC, on the default branch. The weekly run
    # covers Sunday with the full suite.
    - cron: "0 3 * * 1-6"
  workflow_dispatch:

# A manual run replaces one in progress. The CI workflow it calls has its own group.
concurrency:
  group: nightly-run-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Main often sits still overnight, so a commit the last nightly run already
  # tested isn't tested again. A cancelled run doesn't count. A manual run
  # always tests.
  changed:
    name: Check for new commits
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      actions: read
    outputs:
      changed: ${{ steps.changed.outputs.changed }}
    steps:
      - id: changed
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tested=$(gh run list --repo "$REPO" --workflow nightly.yml --branch "$BRANCH" --status completed --limit 20 \
            --json headSha,conclusion --jq '[.[] | select(.conclusion == "success" or .conclusion == "failure")][0].headSha // ""')
          if [ "$tested" = "$SHA" ]; then
            echo "Already tested $SHA."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  # WebKit and Firefox, every shard. Retries are on in CI, so a test that
  # passes on retry counts as flaky, not failed: the Playwright report job
  # lists it in its summary and annotates it with a warning.
  suite:
    name: WebKit and Firefox
    needs: changed
    if: needs.changed.outputs.changed == 'true'
    uses: ./.github/workflows/ci.yml
    with:
      suite: nightly
