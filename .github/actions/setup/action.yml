name: Setup
description: Installs pnpm (from packageManager), Node (from .nvmrc), the workspace dependencies with a cached store, and optionally Playwright browsers.

inputs:
  browsers:
    description: Playwright browsers to install with their system dependencies, separated by spaces. Empty installs none.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4

    - uses: actions/setup-node@v5
      with:
        node-version-file: .nvmrc
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    # The apt mirror can take minutes for the few font packages Playwright adds, so their
    # downloads are kept between runs.
    - name: Keep apt downloads
      if: inputs.browsers != ''
      shell: bash
      run: |
        mkdir -p "$RUNNER_TEMP/apt-archives/partial"
        printf '%s\n' "Dir::Cache::Archives \"$RUNNER_TEMP/apt-archives\";" \
          'Binary::apt::APT::Keep-Downloaded-Packages "true";' 'APT::Sandbox::User "root";' |
          sudo tee /etc/apt/apt.conf.d/99playwright-archives > /dev/null

    - name: Restore apt downloads
      id: apt-cache
      if: inputs.browsers != ''
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ runner.temp }}/apt-archives/*.deb
        key: playwright-apt-${{ runner.os }}-${{ inputs.browsers }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: playwright-apt-${{ runner.os }}-${{ inputs.browsers }}-

    # Runs from tests/ so the browsers match the version that package's Playwright expects.
    - name: Install Playwright browsers
      if: inputs.browsers != ''
      shell: bash
      working-directory: tests
      # The apt step sometimes hangs on a slow mirror until the job times out.
      # An install takes under a minute, so each attempt gets 4 minutes and the
      # install retries twice. A timed-out
      # attempt leaves apt-get running with the dpkg lock held, so it's stopped
      # and the lock waited out before the next one.
      run: |
        for attempt in 1 2 3; do
          timeout 240 npx playwright install --with-deps ${{ inputs.browsers }} && exit 0
          echo "::warning::Playwright install attempt $attempt failed or timed out."
          sudo pkill -x apt-get || true
          while sudo fuser /var/lib/dpkg/lock-frontend /var/lib/dpkg/lock > /dev/null 2>&1; do sleep 2; done
          sudo dpkg --configure -a || true
        done
        exit 1

    - name: Save apt downloads
      if: inputs.browsers != '' && steps.apt-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ runner.temp }}/apt-archives/*.deb
        key: playwright-apt-${{ runner.os }}-${{ inputs.browsers }}-${{ hashFiles('pnpm-lock.yaml') }}
