name: Setup
description: Installs pnpm (from packageManager), Node (from .nvmrc), the workspace dependencies with a cached store, and optionally Playwright browsers.

inputs:
  browsers:
    description: Playwright browsers to install with their system dependencies, separated by spaces. Empty installs none.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

    - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
      with:
        node-version-file: .nvmrc
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    # Runs from tests/ so the browsers match the version that package's Playwright expects.
    # Browsers aren't cached: restoring them still leaves the slow part, the apt dependencies.
    - name: Install Playwright browsers
      if: inputs.browsers != ''
      shell: bash
      working-directory: tests
      # The apt step sometimes hangs on a slow mirror until the job times out.
      # An install takes under a minute, so each attempt gets 4 minutes and the
      # install retries twice. A timed-out
      # attempt leaves apt-get running with the dpkg lock held, so it's stopped
      # and the lock waited out before the next one.
      run: |
        for attempt in 1 2 3; do
          timeout 240 npx playwright install --with-deps ${{ inputs.browsers }} && exit 0
          echo "::warning::Playwright install attempt $attempt failed or timed out."
          sudo pkill -x apt-get || true
          while sudo fuser /var/lib/dpkg/lock-frontend /var/lib/dpkg/lock > /dev/null 2>&1; do sleep 2; done
          sudo dpkg --configure -a || true
        done
        exit 1
