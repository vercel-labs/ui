packages:
  - packages/*
  - apps/*
  - tests
  - examples
  - scripts/typescript7
allowBuilds:
  esbuild: true

catalog:
  "@playwright/test": ^1.63.0
  "@solidjs/vite-plugin": 3.0.0-next.35
  "@solidjs/web": 2.0.0-rc.14
  "@sveltejs/vite-plugin-svelte": ^7.3.1
  "@types/react": ~19.2.2
  "@types/react-dom": ~19.2.2
  "@vitejs/plugin-react": ^6.1.2
  "@vitejs/plugin-vue": ^6.0.9
  react: 19.2.3
  react-dom: 19.2.3
  solid-js: 2.0.0-rc.14
  svelte: ^5.57.2
  svelte-check: ^4.7.6
  typescript: ~5.9.3
  # The native compiler, for plain type checks. `typescript` stays 5.9 for
  # tools that use its JavaScript API, like vue-tsc and svelte-check.
  typescript7: npm:typescript@7.0.2
  vite: ^8.3.3
  vue: ^3.5.43
  vue-tsc: ^3.3.12
patchedDependencies:
  "@solidjs/web@2.0.0-rc.14": patches/@solidjs__web@2.0.0-rc.14.patch
